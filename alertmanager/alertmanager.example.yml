cat > alertmanager/alertmanager.example.yml <<'EOF'
global:
  resolve_timeout: 1m

route:
  receiver: self-healing-webhook
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1m

receivers:
  - name: self-healing-webhook
    webhook_configs:
      - url: http://host.docker.internal:5001/webhook
        send_resolved: false
        http_config:
          authorization:
            type: Bearer
            credentials: REPLACE_WITH_YOUR_WEBHOOK_TOKEN
EOF